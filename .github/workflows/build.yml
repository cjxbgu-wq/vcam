name: Build VCamPlus

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid fakeroot dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Download iPhoneOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd /tmp
          curl -L -o sdks.tar.gz "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz"
          tar -xzf sdks.tar.gz
          for v in 15.6 16.5; do
            if [ -d "sdks-master/iPhoneOS${v}.sdk" ]; then
              cp -R "sdks-master/iPhoneOS${v}.sdk" "$HOME/theos/sdks/"
              echo "Copied iPhoneOS${v}.sdk"
            fi
          done
          echo "=== installed SDKs ==="
          ls -la "$HOME/theos/sdks/"

      - name: Generate obfuscated sources
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 gen_obf_src.py
          echo "=== obfsrc ==="
          ls -la obfsrc/

      - name: Build tweak
        env:
          THEOS: /Users/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          cd "$GITHUB_WORKSPACE"
          make clean
          make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 || { echo "BUILD FAILED"; exit 1; }
          echo "=== dylib (arm64) ==="
          ls -la .theos/obj/arm64/VCamPlus.dylib 2>/dev/null || echo "MISSING arm64"
          echo "=== dylib (arm64e) ==="
          ls -la .theos/obj/arm64e/VCamPlus.dylib 2>/dev/null || echo "MISSING arm64e"
          test -f .theos/obj/arm64/VCamPlus.dylib || { echo "arm64 dylib missing"; exit 1; }
          test -f .theos/obj/arm64e/VCamPlus.dylib || { echo "arm64e dylib missing"; exit 1; }

      - name: Merge and verify
        run: |
          mkdir -p artifact
          lipo -create .theos/obj/arm64/VCamPlus.dylib .theos/obj/arm64e/VCamPlus.dylib -output artifact/VCamPlus.dylib
          # strip 本地符号(静态 C 函数名会进符号表泄露机制名; 先 strip 再签名)
          strip -x artifact/VCamPlus.dylib 2>/dev/null || strip artifact/VCamPlus.dylib
          ldid -S artifact/VCamPlus.dylib
          cp VCamPlus.plist artifact/ 2>/dev/null || true
          echo "=== fat dylib info ==="
          lipo -info artifact/VCamPlus.dylib
          file artifact/VCamPlus.dylib
          ls -la artifact/

      - name: Leak gate (obfuscation verification)
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 check_leak.py artifact/VCamPlus.dylib

      - name: Build deb package (rootless)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p debroot/DEBIAN
          # 布局修复(2026-08-17 装完不替换根因): RootHide Bootstrap 的 ellekit/launchdhook
          # 只扫描 /var/jb/usr/lib/TweakInject/, 不镜像 MobileSubstrate/DynamicLibraries
          # (设备实证: DynamicLibraries 里的 dylib respring 后永不被加载; TweakInject 有
          # 文件才加载)。deb 直接装 TweakInject。
          mkdir -p "debroot/var/jb/usr/lib/TweakInject"
          # 双布局(2026-08-20 SE2 实证): 千面 deb 解剖显示其装 DynamicLibraries
          # (rootless-compat 重定向)+ .roothidepatch 空标记 + 零维护脚本即工作
          # —— RootHide patchloader 按"目录+标记"发现 tweak; 部分环境不扫
          # TweakInject(主设备实证它扫)。两处都放真实文件+标记覆盖两类 loader;
          # 代码侧 vcam_loaded_via_other_path 防双加载(Tweak.m constructor)。
          mkdir -p "debroot/var/jb/Library/MobileSubstrate/DynamicLibraries"

          cp artifact/VCamPlus.dylib "debroot/var/jb/usr/lib/TweakInject/VCamPlus.dylib"
          cp artifact/VCamPlus.plist "debroot/var/jb/usr/lib/TweakInject/VCamPlus.plist" 2>/dev/null || true
          touch "debroot/var/jb/usr/lib/TweakInject/VCamPlus.dylib.roothidepatch"

          cp artifact/VCamPlus.dylib "debroot/var/jb/Library/MobileSubstrate/DynamicLibraries/VCamPlus.dylib"
          cp artifact/VCamPlus.plist "debroot/var/jb/Library/MobileSubstrate/DynamicLibraries/VCamPlus.plist" 2>/dev/null || true
          touch "debroot/var/jb/Library/MobileSubstrate/DynamicLibraries/VCamPlus.dylib.roothidepatch"

          # control/preinst/postinst/postrm 来自仓库(装完即用: postinst 自动 trustcache+respring)
          cp control debroot/DEBIAN/control
          cp preinst debroot/DEBIAN/preinst
          cp postinst debroot/DEBIAN/postinst
          cp postrm debroot/DEBIAN/postrm

          # 维护脚本必须 LF 行尾 + 可执行, 否则 dpkg 报 "bad interpreter" 或拒绝运行
          sed -i '' $'s/\r$//' debroot/DEBIAN/preinst debroot/DEBIAN/postinst debroot/DEBIAN/postrm debroot/DEBIAN/control || true
          chmod 0755 debroot/DEBIAN
          chmod 0644 debroot/DEBIAN/control
          chmod 0755 debroot/DEBIAN/preinst
          chmod 0755 debroot/DEBIAN/postinst
          chmod 0755 debroot/DEBIAN/postrm
          chmod 0755 "debroot/var/jb/usr/lib/TweakInject/VCamPlus.dylib"
          chmod 0644 "debroot/var/jb/usr/lib/TweakInject/VCamPlus.plist" 2>/dev/null || true

          # gzip 打包(供 postprocess 用标准库处理), 再剥离目录条目
          # (2026-08-18 设备实证: /var/jb 是 patchloader 的符号链接,
          #  目录条目触发 dpkg overwrite 冲突, 装不上)
          # preinst(2026-08-20 SE2 设备实证): 目录条目剥离后, 全新设备
          # TweakInject 目录可能不存在 → 解包 ENOENT; preinst 先 mkdir 兜底
          fakeroot dpkg-deb -Zgzip -b debroot VCamPlus.deb
          python3 postprocess_deb.py VCamPlus.deb VCamPlus.deb
          cp VCamPlus.deb artifact/

          echo "=== deb package ==="
          ls -la artifact/VCamPlus.deb
          file artifact/VCamPlus.deb

          echo "=== deb 内容校验(DEBIAN 脚本必须在场) ==="
          dpkg-deb -c VCamPlus.deb
          dpkg-deb -I VCamPlus.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCamPlus-dylib
          path: artifact/VCamPlus.dylib
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: VCamPlus-deb
          path: artifact/VCamPlus.deb
          if-no-files-found: error
